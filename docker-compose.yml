name: nucleo-kokon

services:
  db:
    image: postgres:16-alpine
    container_name: kokon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kokon
      POSTGRES_PASSWORD: kokon_dev_password
      POSTGRES_DB: nucleo_kokon
    ports:
      - '5432:5432'
    volumes:
      - kokon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kokon -d nucleo_kokon']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kokon-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://kokon:kokon_dev_password@db:5432/nucleo_kokon?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET en tu .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET en tu .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    ports:
      - '4000:4000'
    command: >
      sh -c "npx prisma migrate deploy && node src/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        # Variable de BUILD: se incrusta en el bundle de Vite.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: kokon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  kokon-db-data:

# ---------- development ----------
services:
  db:
    image: postgres:16-alpine
    container_name: kokon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kokon
      POSTGRES_PASSWORD: kokon_dev_password
      POSTGRES_DB: nucleo_kokon
      POSTGRES_USER_TEST: kokon
      POSTGRES_PASSWORD_TEST: kokon_test_password
      POSTGRES_DB_TEST: nucleo_kokon_test
    ports:
      - '5432:5432'
    volumes:
      - kokon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kokon -d nucleo_kokon']
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos exclusiva para `npm test`. Se crea sola al arrancar.
  db-test:
    image: postgres:16-alpine
    container_name: kokon-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: kokon
      POSTGRES_PASSWORD: kokon_test_password
      POSTGRES_DB: nucleo_kokon_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kokon -d nucleo_kokon_test']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kokon-backend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://kokon:kokon_dev_password@db:5432/nucleo_kokon?schema=public
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma generate && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kokon-frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  kokon-db-data:
  backend-node-modules:
  frontend-node-modules:
